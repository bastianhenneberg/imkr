[package]
name = "imkr"
version = "0.17.1"
edition = "2024"
description = "A terminal multiplexer and window manager for humans and their coding agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bastianhenneberg/imkr"
readme = "README.md"
keywords = ["terminal", "multiplexer", "tui", "tmux", "agents"]
categories = ["command-line-utilities"]

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
crossterm = { version = "0.29", features = ["serde"] }
libc = "0.2.189"
portable-pty = "0.9.0"
qrcode = { version = "0.14.1", default-features = false }
ratatui = { version = "0.30.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
