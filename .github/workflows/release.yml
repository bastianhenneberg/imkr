name: release

# A tag like `v0.1.0` builds the binaries and attaches them to its release.
# install.sh downloads from there, so the tag has to match Cargo.toml's version.
#
# Every part is its own named step on purpose. Job logs need a token to read,
# job and step results do not — so when something breaks, the step name alone
# has to say what it was: creating the release, building, or uploading.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # No binaries from a tag that does not build, lint and test cleanly.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Nothing else enforces this, and a mismatch is invisible until someone
      # reports a bug: the release would say v0.2.0 and `imkr version` 0.1.0.
      - name: tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag=${GITHUB_REF#refs/tags/v}
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "$tag" = "$version" || {
            echo "tag v$tag does not match Cargo.toml $version" >&2
            exit 1
          }
      - run: rustup update stable --no-self-update
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # Once, not per architecture: two parallel `gh release create` would race.
  # If this job is the one that fails, the token cannot write to the repository.
  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "imkr $GITHUB_REF_NAME" \
              --notes "Static binaries for Linux. See the README for install.sh."
          fi

  binaries:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # musl, so one binary runs on every distribution regardless of its glibc.
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5
      - run: rustup update stable --no-self-update
      # The musl targets and their linkers are not on the runner; this adds them.
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      # install.sh expects the binary at the root of imkr-<target>.tar.gz and a
      # .sha256 next to it in sha256sum's own format, so `sha256sum -c` works.
      - name: archive
        run: |
          dir=imkr-${{ matrix.target }}
          mkdir "$dir"
          cp target/${{ matrix.target }}/release/imkr "$dir"/
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir"/
          tar -czf "$dir.tar.gz" -C "$dir" .
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
          ls -l "$dir.tar.gz" "$dir.tar.gz.sha256"
          tar -tzf "$dir.tar.gz"
      - name: upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "imkr-${{ matrix.target }}.tar.gz" \
            "imkr-${{ matrix.target }}.tar.gz.sha256" \
            --clobber
