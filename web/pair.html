<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>imkr · pair</title>
<link rel="icon" href="icon.svg">
<style>
  :root { --bg:#f6f6f8; --fg:#1e1e2e; --muted:#6c6f85; --card:#fff; --line:#dcdce4; --accent:#1e66f5; --danger:#d20f39; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1e1e2e; --fg:#cdd6f4; --muted:#9399b2; --card:#262637; --line:#3a3a50; --accent:#89b4fa; --danger:#f38ba8; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); display:flex; min-height:100vh; align-items:center; justify-content:center; padding:16px; }
  form { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; width:100%; max-width:360px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 18px; font-size:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input { width:100%; font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  #code { font-family:ui-monospace, monospace; letter-spacing:2px; text-transform:uppercase; }
  button { margin-top:18px; width:100%; font:inherit; font-weight:600; padding:11px; border:0; border-radius:8px; background:var(--accent); color:var(--bg); }
  .error { color:var(--danger); font-size:14px; margin-top:12px; }
  code { font-size:13px; }
</style>
</head>
<body>
<form method="post" action="/pair">
  <h1>imkr · {{MACHINE}}</h1>
  <p>Pair this device: run <code>imkr web pair</code> on the machine and enter the code.</p>
  <label for="code">Code</label>
  <input id="code" name="code" value="{{CODE}}" placeholder="ABCD-EFGH" autocomplete="one-time-code" autocapitalize="characters" required>
  <label for="name">Name of this device</label>
  <input id="name" name="name" placeholder="phone" maxlength="40">
  <button>Pair</button>
  <div class="error">{{MESSAGE}}</div>
</form>
<script>
  const name = document.getElementById('name');
  if (!name.value) name.value = /iPhone|iPad/.test(navigator.userAgent) ? 'iphone' : /Android/.test(navigator.userAgent) ? 'android' : 'browser';
</script>
</body>
</html>
